[tool.poetry]
name = "guapish-bot"
version = "0.1.0"
description = ""
authors = ["lavaskin <lavaskin@gmail.com>"]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.10,<3.15"
py-cord = {version = "^2.8", extras = ["voice"]}
python-dotenv = "^1.0.1"
firebase-admin = "^6.5.0"
yt-dlp = ">=2026.7.4"
curl-cffi = ">=0.10,<0.16"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
pytest-asyncio = "^1.0"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
	"slow: timing sweeps; deselect with -m 'not slow'",
]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
